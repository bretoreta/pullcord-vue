<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pullcord-vue demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --pullcord-ink: rgba(255, 255, 255, 0.35);
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0a0a0b;
        color: #f4f4f5;
        transition: background 0.4s ease, color 0.4s ease;
      }
      body.light {
        background: #f4f4f2;
        color: #111113;
        --pullcord-ink: rgba(0, 0, 0, 0.35);
      }
      main {
        display: grid;
        place-content: center;
        height: 100%;
        gap: 0.75rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.55;
        font-size: 0.9rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
